defaults:
  - _self_
  - model: parseq
  - charset: bengali
  - dataset: real

model:
  _convert_: all
  img_size: [ 32, 128 ]  # [ height, width ]
  max_label_length: 35
  # The ordering in charset_train matters. It determines the token IDs assigned to each character.
  charset_train: bengali
  # For charset_test, ordering doesn't matter.
  charset_test: bengali
  batch_size: 128
  weight_decay: 0.0
  warmup_pct: 0.075  # equivalent to 1.5 epochs of warm up

data:
  _target_: strhub.data.module.SceneTextDataModule
  # root_dir: data
  root_dir: /ssd_scratch/cvit/lalitha/data
  train_dir: ???
  batch_size: ${model.batch_size}
  img_size: ${model.img_size}
  charset_train: ${model.charset_train}
  charset_test: ${model.charset_test}
  max_label_length: ${model.max_label_length}
  remove_whitespace: true
  normalize_unicode: true
  augment: true
  num_workers: 8

trainer:
  _target_: pytorch_lightning.Trainer
  _convert_: all
  # log_every_n_steps: 40
  # val_check_interval: 1.0
  check_val_every_n_epoch: 1
  #max_steps: 169680  # 20 epochs x 8484 steps (for batch size = 384, real data)
  # max_steps : 16740 # 30 epochs x 558 steps (for batch size = 128, psuedo labelled data)
  max_epochs: 800
  gradient_clip_val: 20
  accelerator: gpu
  devices: 2

ckpt_path: null
# pretrained: /ssd_scratch/cvit/lalitha/2_pdf_scraping_data/bengali_ckpt/parseq.ckpt
pretrained: null

hydra:
  output_subdir: config
  run:
    # dir: outputs/${model.name}/${now:%Y-%m-%d}_${now:%H-%M-%S}
    dir: /ssd_scratch/cvit/lalitha/outputs/${model.name}/${now:%Y-%m-%d}_${now:%H-%M-%S}
  sweep:
    dir: multirun/${model.name}/${now:%Y-%m-%d}_${now:%H-%M-%S}
    subdir: ${hydra.job.override_dirname}
